# Prop Pass configuration. Every value here is read by `python propbot.py backtest`
# and `python propbot.py paper`. Credentials never go in this file: they come from
# environment variables (see .env.example).

# ---------------------------------------------------------------------------
# Instruments
# ---------------------------------------------------------------------------
watchlist: [QQQ, SPY, IWM, DIA, XLK, SMH, TQQQ, SQQQ, SOXL, VOO]

# Per-symbol facts used by risk management.
#   group:    correlation group. Positions in the same group and the same effective
#             direction count against risk.max_per_group (QQQ, XLK, SMH, TQQQ... all
#             move with the Nasdaq, so they are NOT independent bets).
#   leverage: exposure multiplier vs the underlying index. Negative = inverse ETF, so a
#             long SQQQ counts as a short Nasdaq position. Used for exposure caps and
#             correlation direction. Position size itself comes from the stop distance,
#             so leveraged ETFs automatically get fewer shares (their ATR is larger).
#   spread_bps: assumed full bid-ask spread for backtests (no historical quotes are used).
instruments:
  QQQ:  {group: nasdaq, leverage: 1,  spread_bps: 0.5}
  XLK:  {group: nasdaq, leverage: 1,  spread_bps: 1.5}
  SMH:  {group: nasdaq, leverage: 1.3, spread_bps: 2.0}
  TQQQ: {group: nasdaq, leverage: 3,  spread_bps: 2.0}
  SQQQ: {group: nasdaq, leverage: -3, spread_bps: 3.0}
  SOXL: {group: nasdaq, leverage: 4,  spread_bps: 3.0}
  SPY:  {group: broad,  leverage: 1,  spread_bps: 0.5}
  VOO:  {group: broad,  leverage: 1,  spread_bps: 1.0}
  DIA:  {group: broad,  leverage: 0.9, spread_bps: 1.5}
  IWM:  {group: small,  leverage: 1,  spread_bps: 1.0}

# ---------------------------------------------------------------------------
# Strategy: EMA crossover on completed candles
# ---------------------------------------------------------------------------
strategy:
  timeframe: 5Min          # candle size (completed candles only)
  fast: 9                  # fast EMA length
  slow: 21                 # slow EMA length
  allow_short: true        # bearish crosses open shorts (only where the broker allows shorting)
  exit_on_opposite: true   # an opposite cross closes the position (and may reverse it)
  entry_start: "09:45"     # New York time; no new entries before this
  entry_end: "15:30"       # no new entries after this
  flatten_at: "15:50"      # close everything at this time (or 10 min before an early close)
  filters:
    # 1. Higher-timeframe trend: longs only above the HTF EMA, shorts only below it.
    htf_trend:   {enabled: false, minutes: 30, ema: 20}
    # 2. Volatility: skip when ATR is unusually low or high vs its own recent median.
    atr_band:    {enabled: false, period: 14, lookback_bars: 390, min_ratio: 0.5, max_ratio: 2.5}
    # 3. Liquidity: candle dollar volume floor (backtest + live) and live bid-ask spread cap.
    #    IEX volume is only a few % of the whole market, so the floor is set per data feed.
    liquidity:   {enabled: true, min_dollar_volume_sip: 250000, min_dollar_volume_iex: 5000, max_spread_bps: 15}
    # 4. Chop: Kaufman efficiency ratio (0 = pure noise, 1 = straight line) over N candles.
    chop:        {enabled: false, period: 12, min_efficiency: 0.3}

# ---------------------------------------------------------------------------
# Risk per trade and portfolio limits
# ---------------------------------------------------------------------------
risk:
  risk_per_trade_pct: 0.25     # % of equity lost if the stop is hit. The backtest sweeps backtest.risk_grid
                               # and recommends a level; copy it here after checking the report.
  stop:
    type: atr                  # atr | fixed
    atr_mult: 1.5              # stop distance = atr_mult x ATR ...
    min_pct: 0.15              # ... but at least this % of price
    max_pct: 1.5               # ... and at most this % of price
    fixed_pct: 0.3             # used when type: fixed
  reward_risk: 2.0             # take profit at this multiple of the stop distance (0 = none)
  trailing:
    enabled: false
    activate_r: 1.0            # start trailing once the trade is up this many R
    atr_mult: 1.0              # trail this many ATR behind the best price
  max_positions: 3             # simultaneous positions
  max_per_group: 2             # same group + same effective direction
  max_gross_exposure: 4.0      # leverage-adjusted notional / equity (Alpaca intraday buying power is ~4x)
  max_trades_per_day: 15       # new entries per day
  sizing_buffer_pct: 0.02      # extra % of price added to the stop when sizing, for gaps only
                               # (spread and slippage are already in the cost estimate)

# ---------------------------------------------------------------------------
# Prop challenge rules. Firms calculate these differently: set them to YOUR firm's
# exact rules. Missing or invalid values stop the bot from starting.
# ---------------------------------------------------------------------------
challenge:
  profit_target_pct: 8
  max_daily_loss_pct: 5
  max_total_loss_pct: 10
  daily_loss_base: initial       # initial: limit = % of starting balance | day_start: % of the day's start value
  day_start_reference: higher    # balance | equity | higher (of the two at the daily reset)
  drawdown_type: static          # static: floor fixed at start | trailing: floor follows the high-water mark
  trailing_basis: equity         # equity | balance (only for trailing)
  trailing_lock_at_initial: true # trailing floor stops rising once it reaches the starting balance
  daily_reset: "00:00"           # New York time the daily loss counter resets
  safety_buffer_pct: 1.0         # stop opening trades within this % (of starting balance) of a limit
  stop_at_target: true           # flatten and stop when the target is reached
  window_days: 30                # calendar days allowed (backtest challenge simulation)
  # Set to true only after checking that your firm allows: ETFs, leveraged ETFs, shorting,
  # automated trading, and uses the drawdown rules above. Paper trading works either way.
  confirmed_firm_rules: false

# ---------------------------------------------------------------------------
# Trading costs (backtest). Alpaca stock trades are commission-free; regulatory fees apply.
# ---------------------------------------------------------------------------
costs:
  commission_per_share: 0.0
  min_commission: 0.0
  sec_fee_rate: 0.0000278       # x sell notional (SEC Section 31; check the current rate)
  taf_per_share: 0.000166       # FINRA TAF on sells, per share ...
  taf_max: 8.30                 # ... capped per trade
  slippage_bps: 1.0             # extra adverse fill per market/stop order, on top of half the spread
  default_spread_bps: 2.0       # for symbols missing from `instruments`

# ---------------------------------------------------------------------------
# Backtest
# ---------------------------------------------------------------------------
backtest:
  data_feed: iex                # iex = the same feed the paper bot trades on (recommended) | sip = all exchanges
  cache_dir: data/cache
  starting_cash: 25000          # >= $25k avoids US pattern-day-trader limits on margin accounts
  # Chronological, non-overlapping. The test period is only run once, on the chosen config.
  train:      ["2023-01-01", "2024-06-30"]
  validation: ["2024-07-01", "2025-03-31"]
  test:       ["2025-04-01", "2026-09-30"]
  challenge_every_n_days: 5     # start a simulated challenge every N sessions
  monte_carlo_runs: 5000
  min_trades_per_day: 4         # configs trading outside this band (per session) are rejected
  max_trades_per_day: 15
  regime_symbol: QQQ            # market regime labels come from this symbol's daily moves
  # Risk-per-trade sweep (train + validation only) for the chosen signal config. A level is only
  # recommended if its challenge fail rate is <= max_fail_pct and its pass rate beats a zero-edge
  # (pure luck) baseline by min_edge_margin_pct points; otherwise risk_per_trade_pct is kept.
  risk_grid: [0.25, 0.375, 0.5, 0.75]
  sweep_max_gross_exposure: 4.0
  max_fail_pct: 10
  min_edge_margin_pct: 10

# ---------------------------------------------------------------------------
# Paper trading (Alpaca paper account only; live endpoints are refused)
# ---------------------------------------------------------------------------
paper:
  data_feed: iex                # free real-time feed
  poll_seconds: 15
  state_dir: state
  log_dir: logs
  flatten_on_exit: true         # close positions when the bot shuts down
  close_unknown_positions: true # close broker positions the bot didn't open (else just log them)
